[pytest]
testpaths = tests
# The default run does everything, including the rebuilds, because the
# byte-for-byte claim is the one this dataset is built around and a suite
# that skipped it by default would be asserting it rather than showing it.
# About forty seconds.
#
#   python3 -m pytest                 # everything
#   python3 -m pytest -m "not slow"   # without the rebuilds, about ten seconds
markers =
    slow: runs the build or the prover requests again in a separate process
